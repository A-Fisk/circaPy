name: Python CI using uv 

on: [pull_request]

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with: 
          version: "0.10.4"
     
      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Test with makefile
        shell: bash 
        run: |
          make test
